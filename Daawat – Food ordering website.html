<!DOCTYPE html><html><head><meta charset="utf-8"><title>Daawat</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;margin:0 auto;background:#FFF9EE;color:#241D14;font:15px/1.5 system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:#C8321E;color:#fff;padding:9px 18px;font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;height:70px;padding:0 40px;border-bottom:1px solid #EADFC9}
.logo{font-size:26px;font-weight:800;color:#C8321E}
.hero{margin:32px 40px;padding:48px;border-radius:24px;background:#C8321E;color:#fff;display:flex;justify-content:space-between;align-items:center}
.hero h1{font-size:46px;line-height:1.1;max-width:560px}.hero p{margin-top:12px;opacity:.9}.hero span{font-size:130px}
h2{padding:0 40px;font-size:26px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:16px 40px 48px}
.card{background:#fff;border:1px solid #EADFC9;border-radius:18px;overflow:hidden}
.pic{height:140px;display:grid;place-items:center;font-size:70px}
.body{padding:14px 16px}.body p{color:#7A6F60;font-size:13px;margin:4px 0 12px}
.row{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px}
#cart{position:fixed;top:0;right:0;bottom:0;width:380px;background:#fff;padding:24px;box-shadow:-8px 0 24px #0003;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;gap:12px}
#cart.on{transform:none}
#list{flex:1;overflow:auto}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #EADFC9}
.it button{padding:2px 10px;margin:0 4px}
</style></head><body>
<header><div class="logo">🍛 Daawat</div><button onclick="$('cart').classList.toggle('on')">Cart (<span id="n">0</span>)</button></header>
<div class="hero"><div><h1>Hot food at your door in 30 minutes.</h1><p>Free delivery above ₹399.</p></div><span>🍲</span></div>
<h2>Popular dishes</h2><div id="grid"></div>
<aside id="cart"><h2 style="padding:0">Your cart</h2><div id="list"></div><h3>Total: <span id="tot"></span></h3><button onclick="order()">Place order</button><button style="background:#7A6F60" onclick="$('cart').classList.remove('on')">Close</button></aside>
<script>
const D=[["Butter Chicken","🍗",349,"Creamy tomato gravy.","#FFD9B8"],["Paneer Tikka","🧀",289,"Grilled in a tandoor.","#FFE7A3"],["Hyderabadi Biryani","🍚",379,"Slow-cooked basmati.","#FFE0A0"],["Masala Dosa","🌯",159,"Crisp, with sambar.","#FFEBC2"]],C={},$=i=>document.getElementById(i);
function add(i,d){C[i]=(C[i]||0)+d;if(C[i]<1)delete C[i];draw()}
function draw(){let n=0,t=0,h="";for(const i in C){n+=C[i];t+=C[i]*D[i][2];h+=`<div class="it"><span>${D[i][0]}</span><span><button onclick="add(${i},-1)">−</button>${C[i]}<button onclick="add(${i},1)">+</button></span><b>₹${C[i]*D[i][2]}</b></div>`}$("n").textContent=n;$("list").innerHTML=h||"Your cart is empty";$("tot").textContent="₹"+t}
function order(){if(!Object.keys(C).length)return;alert("Order placed! Arriving in 30 minutes.");for(const i in C)delete C[i];draw();$("cart").classList.remove("on")}
$("grid").innerHTML=D.map((d,i)=>`<div class="card"><div class="pic" style="background:${d[4]}">${d[1]}</div><div class="body"><h3>${d[0]}</h3><p>${d[3]}</p><div class="row">₹${d[2]}<button onclick="add(${i},1)">Add</button></div></div></div>`).join("");
draw()
</script></body></html>
